<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yaliwal Lifespaces - SilverSprings — Live Plot Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --ink: #1D1D1F;
    --ink-soft: #6E6E73;
    --border: #D2D2D7;
    --border-soft: #E8E8ED;
    --accent: #0071E3;
    --accent-soft: rgba(0,113,227,0.08);
    --available: #2FA84F;
    --sold: #FF3B30;
    --booked: #FF9500;
    --hold: #AF52DE;
    --unknown: #86868B;
    --amenity: #4FAE7A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Inter', sans-serif; font-variant-numeric:tabular-nums;}

  #app{max-width:1280px;margin:0 auto;padding:32px 24px 60px;}

  /* ---------- HEADER ---------- */
  .topbar{
    background:var(--surface);
    border-radius:18px;
    padding:28px 28px 24px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand-mark{
    width:48px;height:48px;flex:none;
    background:var(--ink);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#fff;
  }
  .brand h1{
    margin:0;font-size:26px;letter-spacing:-0.02em;font-weight:800;color:var(--ink);
  }
  .brand p{
    margin:3px 0 0;font-size:13px;color:var(--ink-soft);letter-spacing:0.01em;font-weight:500;
  }
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}

  .setup-btn{
    background:var(--bg);border:none;color:var(--ink);
    border-radius:20px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;
    display:flex;align-items:center;gap:6px;
  }
  .setup-btn:hover{background:var(--border-soft);}

  .brand-row{display:flex;align-items:flex-start;}

  .status-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    margin-top:22px;padding-top:20px;border-top:1px solid var(--border-soft);
  }
  .legend{display:flex;flex-wrap:wrap;gap:8px;}
  .legend-chip{
    display:flex;align-items:center;gap:7px;
    background:var(--bg);
    border-radius:20px;padding:6px 14px 6px 10px;
    font-size:13px;font-weight:500;color:var(--ink);
  }
  .swatch{width:9px;height:9px;border-radius:50%;flex:none;}
  .legend-count{color:var(--ink);font-weight:700;}

  .sync{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}
  #refreshBtn{
    background:var(--accent);color:#fff;border:none;border-radius:20px;
    padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  #refreshBtn:hover{background:#0077ED;}
  #refreshBtn:disabled{opacity:0.5;cursor:default;}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
  #searchInput{
    flex:1;min-width:180px;
    background:var(--bg);border:1px solid transparent;color:var(--ink);
    border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;
  }
  #searchInput::placeholder{color:var(--ink-soft);}
  #searchInput:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-soft);}
  .filter-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .fchip{
    background:var(--bg);border:none;color:var(--ink);
    border-radius:20px;padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;
  }
  .fchip:hover{background:var(--border-soft);}
  .fchip.active{background:var(--ink);color:#fff;font-weight:600;}

  .banner{
    display:none;
    background:#FFF4E5;color:#9A5B00;
    padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;font-weight:500;
  }

  /* ---------- MAIN LAYOUT ---------- */
  main{display:flex;gap:20px;align-items:flex-start;}
  .canvas-wrap{
    flex:1;min-width:0;
    background:var(--surface);
    border-radius:18px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
    padding:20px;
    overflow:hidden;
  }
  svg{width:100%;height:auto;display:block;}

  .plot{cursor:pointer;transition:filter 0.15s ease, opacity 0.15s ease;}
  .plot:hover{filter:brightness(1.08);}
  .plot.dimmed{opacity:0.15;}
  .plot.selected{stroke:var(--ink);stroke-width:3;}
  .plot-label{
    font-family:'Inter', sans-serif;font-size:7px;fill:#fff;pointer-events:none;font-weight:700;
  }
  .road-label{
    font-family:'Inter', sans-serif;font-size:10px;fill:var(--ink-soft);letter-spacing:0.02em;font-weight:500;
  }
  .amenity-zone-label{
    font-family:'Inter', sans-serif;font-size:10px;fill:#3A8A5C;font-weight:700;letter-spacing:0.01em;
  }
  .block-label{
    font-family:'Inter', sans-serif;font-size:15px;fill:var(--ink);font-weight:800;letter-spacing:-0.01em;
  }
  .amenity{fill:var(--amenity);stroke:none;}
  .amenity-label{font-family:'Inter', sans-serif;font-size:10px;fill:#fff;font-weight:700;pointer-events:none;}

  /* ---------- DETAIL PANEL ---------- */
  .detail-panel{
    width:290px;flex:none;
    background:var(--surface);
    border-radius:18px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
    padding:22px;
  }
  .detail-panel.hidden{display:none;}
  .detail-panel h2{margin:0 0 2px;font-size:28px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);}
  .detail-status{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;letter-spacing:0.01em;
    padding:5px 12px;border-radius:20px;margin:10px 0 18px;font-weight:600;
  }
  .detail-row{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border-soft);font-size:13.5px;}
  .detail-row:first-of-type{border-top:none;}
  .detail-row span:first-child{color:var(--ink-soft);}
  .detail-row span:last-child{font-weight:600;text-align:right;color:var(--ink);}
  .close-btn{
    float:right;background:var(--bg);border:none;color:var(--ink);font-size:16px;cursor:pointer;line-height:1;
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .close-btn:hover{background:var(--border-soft);}
  .empty-panel{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:44px 10px;}
  .empty-panel .glyph{font-size:26px;display:block;margin-bottom:12px;}

  footer{
    text-align:center;margin-top:20px;font-size:12px;color:var(--ink-soft);font-weight:500;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.4);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--surface);border-radius:18px;
    max-width:520px;width:100%;padding:28px;max-height:85vh;overflow:auto;
  }
  .modal h3{margin-top:0;font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  .modal ol{padding-left:20px;font-size:14px;line-height:1.7;color:var(--ink);}
  .modal code{
    background:var(--bg);padding:2px 6px;border-radius:5px;font-size:12.5px;color:var(--accent);
  }
  .modal .close-btn{position:relative;top:-4px;}

  /* ---------- MOBILE ---------- */
  @media (max-width: 820px){
    main{flex-direction:column;}
    .detail-panel{width:100%;}
    .sync{margin-left:0;width:100%;justify-content:space-between;}
    .topbar-right{margin-left:0;}
    .brand-row{flex-wrap:wrap;}
  }
</style>
</head>

<div id="app">

  <div class="topbar">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark">⌂</div>
        <div>
          <h1 id="companyName">Ridgeview Developers</h1>
        </div>
      </div>
    </div>

    <div class="status-row">
      <div class="legend" id="legend"></div>
      <div class="sync">
        <span id="lastUpdated">Loading…</span>
        <button id="refreshBtn">↻ Refresh</button>
      </div>
    </div>

    <div class="controls">
      <input id="searchInput" class="mono" placeholder="Find a plot, e.g. 148" />
      <div class="filter-chips" id="filterChips"></div>
    </div>
  </div>

  <div class="banner" id="sampleBanner">
    ⚠ Showing sample data — this page isn't connected to a Google Sheet yet.
  </div>

  <main>
    <div class="canvas-wrap">
      <svg id="siteplan" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <aside class="detail-panel" id="detailPanel">
      <div class="empty-panel">
        <span class="glyph">▦</span>
        Tap any plot on the layout<br>to see its details here.
      </div>
    </aside>
  </main>

  <footer>Synced live from Google Sheets · Layout is a schematic guide, not to scale</footer>
</div>

<script>
(function(){

  // ============================================================
  // 1. CONFIGURE THIS SECTION FOR YOUR PROJECT
  // ============================================================
  const CONFIG = {
    companyName: "Yaliwal Lifespaces",
    // Paste your published Google Sheet CSV link below (see Setup guide in the app)
    sheetCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSU8SMEafAsNJD1MQPD7xO_-xg8wmP4cUGQuts3Q8qR6-kEmrkn-HYK7Oo8fCu8d9nPRF4mbH8n2y9L/pub?gid=185693946&single=true&output=csv",
    refreshIntervalSeconds: 30
  };

  document.getElementById('companyName').textContent = CONFIG.companyName;

  // Layout generation parameters — matches the Tharihal 95 KJP layout:
  // two plot fields (North field: 1-239ish, South field: 240-271 + irregular
  // corner runs) split by a central road, numbered sequentially left-to-right,
  // top-to-bottom, matching the approved survey drawing's own plot numbers.
  const LAYOUT = {
    margin: 50,
    top: 100
  };

  const STATUS_COLOR = {
    available: 'var(--available)',
    booked: 'var(--booked)',
    sold: 'var(--sold)',
    hold: 'var(--hold)',
    unknown: 'var(--unknown)',
    amenity: 'var(--amenity)'
  };
  const STATUS_LABEL = {
    available: 'Available', booked: 'Booked', sold: 'Sold', hold: 'On Hold', unknown: 'Unlisted', amenity: 'Not for Sale'
  };

  // ============================================================
  // 2. LAYOUT GENERATION — traced directly from the numbered hoarding
  // image you shared. Plot positions and numbering are read from the
  // real artwork (verified with OCR + manual cross-checks), not a
  // generic grid. Coordinates are in the hoarding's own pixel space
  // (1123 x 1600) so the SVG viewBox matches it 1:1.
  // ============================================================
  function buildLayout(){
    const plots = [];
    const decor = [];

    function range(a, b){ // inclusive, works ascending or descending
      const out = []; const step = a <= b ? 1 : -1;
      for (let v = a; step > 0 ? v <= b : v >= b; v += step) out.push(v);
      return out;
    }

    function addPairSection(leftSeq, rightSeq, xLeft, xRight, yTop, yBot, w, h){
      const rows = leftSeq.length;
      const spacing = rows > 1 ? (yBot - yTop) / (rows - 1) : 0;
      for (let r = 0; r < rows; r++){
        const y = yTop + r * spacing;
        plots.push({ id: String(leftSeq[r]), block:'Residential', x:xLeft - w/2, y:y - h/2, w, h });
        plots.push({ id: String(rightSeq[r]), block:'Residential', x:xRight - w/2, y:y - h/2, w, h });
      }
    }

    // Section A — single column, plots 2-14
    {
      const nums = range(2,14), rows = nums.length;
      const yTop = 372, yBot = 714.5, x = 528, w = 48;
      const spacing = (yBot - yTop)/(rows-1), h = 27;
      nums.forEach((n,r) => plots.push({ id:String(n), block:'Residential', x:x-w/2, y:yTop+r*spacing-h/2, w, h }));
    }
    // Sections B, C — 13-row zigzags either side of section A
    addPairSection(range(27,15), range(28,40), 608, 658, 368.5, 714.5, 48, 28);
    addPairSection(range(53,41), range(54,66), 737.25, 787.25, 368.5, 714.5, 48, 28);
    // Section D — 7-row zigzag beside the sports court
    addPairSection(range(73,67), range(74,80), 862.25, 924.25, 483.5, 709.5, 58, 35);
    // Sections E-I — 16-row zigzags, the main plot fields
    addPairSection(range(81,96), range(112,97), 225, 276, 791.5, 1241.5, 48, 28);
    addPairSection(range(113,128), range(144,129), 354.5, 403.5, 791.5, 1241.5, 48, 28);
    addPairSection(range(145,160), range(176,161), 479.75, 530, 791.5, 1241.5, 48, 28);
    addPairSection(range(177,192), range(208,193), 607.75, 658, 791.5, 1241.5, 48, 28);
    addPairSection(range(209,224), range(240,225), 737.25, 788, 791.5, 1241.5, 48, 28);
    // Section J — 12-row straight pairing (not zigzag)
    addPairSection(range(241,252), range(253,264), 872, 932.25, 790.5, 1234.5, 58, 38);
    // Bottom row — plots 265-271, following the real slight downward slant
    {
      const nums = range(265,271), n = nums.length;
      const xStart = 660.5, spacing = 39.55, w = 38, h = 40;
      const slantM = 0.0802, slantB = 1240.07; // fit from the real hoarding
      nums.forEach((num,i) => {
        const x = xStart + i*spacing;
        const y = slantM*x + slantB;
        plots.push({ id:String(num), block:'Residential', x:x-w/2, y:y-h/2, w, h });
      });
    }
    // Plot 1 — the large corner plot beside the Fruit Garden. Tracked for
    // status/counts but not drawn on the map (it sits inside the garden
    // artwork, so a colored box there covers the illustration).
    plots.push({ id:'1', block:'Residential', x:435-7, y:225-7, w:14, h:14, hidden:true });

    // Amenity plots 272-277 (tracked with real status from the sheet)
    const amenityIds = ['272','273','274','275','276','277'];
    const amenityLabels = { '272':'Park', '273':'Park', '274':'Park', '275':'Park', '276':'Park', '277':'Civic Amenity' };
    const amenityY = 1360, amenityW = 110, amenityH = 42, amenityGap = 12;
    amenityIds.forEach((id, i) => {
      plots.push({ id, block: amenityLabels[id], amenity:true,
        x: 190 + i*(amenityW+amenityGap), y: amenityY, w: amenityW, h: amenityH });
    });

    // Decorative amenity zones, matching the hoarding's real artwork
    decor.push({ label:'Fruit Garden', x:280, y:130, w:180, h:190 });
    decor.push({ label:'Clubhouse & Pool', x:460, y:130, w:350, h:190 });
    decor.push({ label:'Landscape Garden', x:810, y:150, w:150, h:170 });
    decor.push({ label:'Multisport Court', x:828, y:352, w:135, h:110 });
    decor.push({ label:'Jogging Track & Outdoor Gym', x:55, y:757, w:135, h:520, rotated:true });
    decor.push({ label:'Fruit Garden', x:190, y:1263, w:415, h:60 });

    return { plots, decor, totalWidth: 1123, totalHeight: 1440, contentBottom: 1335 };
  }

  const layoutData = buildLayout();
  const { plots: LAYOUT_PLOTS, totalWidth, totalHeight } = layoutData;
  document.getElementById('siteplan').setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);

  // ============================================================
  // 3. SNAPSHOT DATA — real statuses exported from the Google Sheet on

    rows.forEach(row => {
      const plotNo = (row.PlotNo || '').trim();
      if (!plotNo) return;
      map[plotNo] = {
        plotNo,
        block: row.Block || '',
        status: normalizeStatus(row.Status),
        width: row.WidthM || '',
        length: row.LengthM || '',
        areaSqm: row.AreaSqM || '',
        areaSqft: row.AreaSqFt || '',
        facing: row.Facing || '',
        price: row.PricePerSqYd || row.Price || '',
        notes: row.Notes || ''
      };
    });
    return map;
  }

  // ============================================================
  // 4. CSV FETCH + PARSE
  // ============================================================
  function parseCSV(text){
    const rows = [];
    let cur = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ cur.push(field); field=''; }
        else if (c === '\n' || c === '\r'){
          if (field.length || cur.length){ cur.push(field); rows.push(cur); cur=[]; field=''; }
          if (c === '\r' && text[i+1] === '\n') i++;
        } else { field += c; }
      }
    }
    if (field.length || cur.length){ cur.push(field); rows.push(cur); }
    if (!rows.length) return [];
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1).filter(r => r.some(v => v.trim() !== '')).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = (r[i] || '').trim());
      return obj;
    });
  }

  function normalizeStatus(raw){
    const s = (raw || '').toLowerCase().trim();
    if (s === 'available' || s === 'open' || s === 'free') return 'available';
    if (s === 'booked' || s === 'reserved') return 'booked';
    if (s === 'sold') return 'sold';
    if (s === 'hold' || s === 'on hold') return 'hold';
    if (s === 'not for sale' || s === 'amenity' || s === 'park' || s === 'civic amenity') return 'amenity';
    return 'unknown';
  }

  async function fetchSheetData(){
    if (!CONFIG.sheetCsvUrl || CONFIG.sheetCsvUrl.indexOf('PASTE_YOUR') === 0){
      const banner = document.getElementById('sampleBanner');
      banner.style.display = 'block';
      banner.textContent = '⚠ Not connected to a live Google Sheet yet — showing a snapshot exported on Aug 18, 2026.';
      return bakedSnapshotData();
    }
    try {
      const res = await fetch(CONFIG.sheetCsvUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('Sheet fetch failed: ' + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      const map = {};
      rows.forEach(row => {
        const plotNo = (row.PlotNo || row.plotno || row['Plot No'] || '').trim();
        if (!plotNo) return;
        map[plotNo] = {
          plotNo,
          block: row.Block || '',
          status: normalizeStatus(row.Status),
          width: row.WidthM || '',
          length: row.LengthM || '',
          areaSqm: row.AreaSqM || '',
          areaSqft: row.AreaSqFt || '',
          facing: row.Facing || '',
          price: row.PricePerSqYd || row.Price || '',
          notes: row.Notes || ''
        };
      });
      document.getElementById('sampleBanner').style.display = 'none';
      return map;
    } catch (err){
      console.warn('Falling back to snapshot data:', err);
      document.getElementById('sampleBanner').style.display = 'block';
      document.getElementById('sampleBanner').textContent = '⚠ Could not reach the Google Sheet — showing a snapshot exported on Aug 18, 2026.';
      return bakedSnapshotData();
    }
  }

    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;

  function drawHoardingBackground(svg){
    svg.appendChild(el('image', {
      href: `data:image/jpeg;base64,${HOARDING_IMAGE_B64}`,
      x:0, y:0, width: totalWidth, height: 1600,
      preserveAspectRatio:'xMidYMid meet'
    }));
  }

  function render(){
    const svg = document.getElementById('siteplan');
    svg.innerHTML = '';
    drawHoardingBackground(svg);
    drawStaticDecor(svg);

    const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    const counts = {available:0, booked:0, sold:0, hold:0, unknown:0};

    LAYOUT_PLOTS.forEach(p => {
      const data = currentData[p.id] || { plotNo: p.id, status: p.amenity ? 'amenity' : 'unknown', block: p.block, size:'', facing:'', price:'', notes:'' };
      if (!p.amenity) counts[data.status] = (counts[data.status] || 0) + 1;
      if (p.hidden) return; // tracked for counts, but not drawn on the map

      const matchesFilter = p.amenity || activeFilter === 'all' || data.status === activeFilter;
      const matchesSearch = !searchTerm || p.id.toLowerCase().includes(searchTerm);

      const rect = el('rect', {
        class: 'plot' + (!matchesFilter || !matchesSearch ? ' dimmed' : '') + (selectedId === p.id ? ' selected' : ''),
        x: p.x, y: p.y, width: p.w, height: p.h, rx: 4,
        fill: `var(--${data.status})`, 'fill-opacity': 0.72, stroke: `var(--${data.status})`, 'stroke-width': 1.5
      });
      rect.addEventListener('click', () => selectPlot(p.id, data));
      svg.appendChild(rect);

      svg.appendChild(el('text', {
        class:'plot-label', x: p.x + p.w/2, y: p.y + p.h/2 + 3, 'text-anchor':'middle'
      }, p.id));
    });

    renderLegend(counts);
  }

  function renderLegend(counts){
    const legend = document.getElementById('legend');
    legend.innerHTML = '';
    ['available','booked','sold','hold'].forEach(status => {
      const chip = document.createElement('div');
      chip.className = 'legend-chip';
      chip.innerHTML = `<span class="swatch" style="background:var(--${status})"></span>${STATUS_LABEL[status]} <span class="legend-count">${counts[status] || 0}</span>`;
      legend.appendChild(chip);
    });
  }

  function selectPlot(id, data){
    selectedId = id;
    const panel = document.getElementById('detailPanel');
    panel.innerHTML = `
      <button class="close-btn" id="panelClose">×</button>
      <h2 class="mono">${data.plotNo}</h2>
      <div class="detail-status" style="background:${`var(--${data.status})`}22; color:${`var(--${data.status})`}; border:1px solid ${`var(--${data.status})`}">
        ${STATUS_LABEL[data.status]}
      </div>
      <div class="detail-row"><span>Type</span><span>${data.block || '—'}</span></div>
      <div class="detail-row"><span>Dimensions</span><span>${data.width && data.length ? data.width + ' × ' + data.length + ' m' : '—'}</span></div>
      <div class="detail-row"><span>Area</span><span>${data.areaSqm ? data.areaSqm + ' sq.m (' + data.areaSqft + ' sq.ft)' : '—'}</span></div>
      <div class="detail-row"><span>Facing</span><span>${data.facing || '—'}</span></div>
      <div class="detail-row"><span>Price</span><span>${data.price || '—'}</span></div>
      <div class="detail-row"><span>Notes</span><span>${data.notes || '—'}</span></div>
    `;
    document.getElementById('panelClose').addEventListener('click', () => {
      selectedId = null;
      panel.innerHTML = `<div class="empty-panel"><span class="glyph">▦</span>Tap any plot on the layout<br>to see its details here.</div>`;
      render();
    });
    render();
  }

  // ============================================================
  // 6. CONTROLS
  // ============================================================
  const filters = ['all','available','booked','sold','hold'];
  const filterChipsEl = document.getElementById('filterChips');
  filters.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'fchip' + (f === 'all' ? ' active' : '');
    btn.textContent = f === 'all' ? 'All' : STATUS_LABEL[f];
    btn.addEventListener('click', () => {
      activeFilter = f;
      document.querySelectorAll('.fchip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
    filterChipsEl.appendChild(btn);
  });

  document.getElementById('searchInput').addEventListener('input', render);

  document.getElementById('refreshBtn').addEventListener('click', () => loadData(true));

  // ============================================================
  // 7. LOAD + POLL
  // ============================================================
  async function loadData(manual){
    const btn = document.getElementById('refreshBtn');
    if (manual){ btn.disabled = true; btn.textContent = '↻ Syncing…'; }
    currentData = await fetchSheetData();
    render();
    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    if (manual){ btn.disabled = false; btn.textContent = '↻ Refresh'; }
  }

  loadData();
  setInterval(() => loadData(false), CONFIG.refreshIntervalSeconds * 1000);

})();
</script>
